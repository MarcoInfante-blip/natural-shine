<section id="services" class="services">
    <div class="container">
        <div class="section-title">
            <span class="section-subtitle">NUESTROS SERVICIOS</span>
            <h2>Tratamientos <span class="text-italic">Orgánicos</span></h2>
        </div>

        <div class="services-grid">
            @for (service of services; track $index) {
            <div class="service-block scroll-reveal" appScrollReveal [delay]="$index * 100">
                <div class="service-image">
                    <img [src]="service.image" [alt]="service.name">
                    <div class="service-hover">
                        <button class="btn btn-outline" (click)="scrollToSection('booking')">VER MÁS</button>
                    </div>
                </div>

                <div class="service-info">
                    <h3 class="service-name">{{ service.name }}</h3>
                    <p class="service-summary">{{ service.description }}</p>
                </div>
            </div>
            }
        </div>
    </div>
</section>
